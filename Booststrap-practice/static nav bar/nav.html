<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    
    <ul class="nav nav-pills  justify-content-center">
        <li class="nav-item">
            <button class="nav-link " data-bs-toggle="tab" data-bs-target="#home">Home</button>
        </li>
        <li class="nav-item">
            <button class="nav-link " data-bs-toggle="tab" data-bs-target="#about">About</button>
        </li>
        <li class="nav-item">
            <button class="nav-link " data-bs-toggle="tab" data-bs-target="#contact">Contact us</button>
        </li>
    </ul>

    <div class="nav-tabs">
        <div class="tab-pane show fade active" id="home">
            <p class="tab-content">
                Mouli
            </p>
        </div>
        <div class="tab-pane fade" id="about">
            <p class="tab-content">
                Sasi
            </p>
        </div>
        <div class="tab-pane fade" id="contact">
            <p class="tab-content">
                Pooja
            </p>
        </div>
    </div>

    <script src="/node_modules/jquery/dist/jquery.js"></script>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>
</html>
