<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">

<body class="container-fluid">
    <header>
        <h1 class="text-center">Cards</h1>

    <section>
        <div class="card-container d-flex flex-wrap gap-3">
            <div class="card cards">
                <div class="card-header">
                    <img class="card-img-top" src="./assets/formalShirt.jpg" alt="Formal shirt">
                </div>
                <div class="card-body">
                    <h4 class="card-title">Men's Formal Shirt</h4>
                    <p class="card-subtitle">Regular Fit</p>
                    <p class="card-text">
                        <span class="price"> &#8377; 1499 </span> 
                        <span class="text-decoration-line-through"> &#8377; 2399</span> 
                        <span class="discount"> 20% Off </span>
                    </p>

                        <span class="bi bi-star-fill"></span> 
                        <span class="bi bi-star-fill"></span> 
                        <span class="bi bi-star-fill"></span> 
                        <span class="bi bi-star-half"></span>
                        <span class="text-black">4.1</span>
                    </p>
                </div>
                <div class="card-footer">
                    <button class="btn btn-warning  w-100">
                        <span class="bi bi-cart4"></span> Add to Cart
                    </button>
                </div>
            </div>

                    <button class="btn btn-warning  w-100">
                        <span class="bi bi-cart4"></span> Add to Cart
                    </button>
