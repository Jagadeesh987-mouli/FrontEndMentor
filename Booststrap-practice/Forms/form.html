<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center " style="height: 820px;">
        <form action="#" class="d-flex flex-column justify-content-center align-items-center gap-3 border border-3  p-5">
            <h3 class="form-control-label">New User ?</h3>
            <div>
                <label for="usernameinput" class="form-label">Username : </label>
                <input type="text" name="uname" class="form-control">
            </div>
            <div>
                <label for="inputpassword" class="form-label">Password :</label>
                
                <input type="password" name="pword" class="form-control">
            </div>
            <div class="form-text">We'll never share your credentials with anyone else.</div>
            <div> <input type="checkbox" class="form-check-input"></input> I agree</div>
            <button class="btn btn-warning">Register</button>
        </form>
    </div>
</body>
</html>
