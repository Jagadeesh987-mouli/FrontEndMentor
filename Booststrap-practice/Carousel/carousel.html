<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    <h1>Carousel</h1>

    <div class="carousel carousel-dark carousel-fade m-5" data-bs-ride="carousel" id="banner1">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="1000">
                <img src="./assets/img1.png" alt="img1">
            </div>
            <div class="carousel-item" data-bs-interval="1000">
                <img src="./assets/img2.png" alt="img2">
            </div>
            <div class="carousel-item" data-bs-interval="1000">
                <img src="./assets/img3.png" alt="img3">
            </div>
            <div class="carousel-item" data-bs-interval="1000">
                <img src="./assets/img4.png" alt="img4">
            </div>
            <div class="carousel-item" data-bs-interval="1000">
                <img src="./assets/img5.png" alt="img5">
            </div>
            <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#banner1">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#banner1">
                <span class="carousel-control-next-icon"></span>
            </button>

            <div class="carousel-indicators">
                <button class="active" data-bs-slide-to="0" data-bs-target="#banner1"></button>
                <button data-bs-slide-to="1" data-bs-target="#banner1"></button>
                <button data-bs-slide-to="2" data-bs-target="#banner1"></button>
                <button data-bs-slide-to="3" data-bs-target="#banner1"></button>
                <button data-bs-slide-to="4" data-bs-target="#banner1"></button>
            </div>
        </div>
    </div>

    <script src="/node_modules/jquery/dist/jquery.js"></script>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>
</html>
